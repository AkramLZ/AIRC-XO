<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>XO · AI Robotics Club</title>
  <meta name="description" content="Take on the AI Robotics Club at XO. Level: Hardest. If you win, your prize is waiting for you!">
  <meta name="theme-color" content="#0d101d">
  <meta property="og:title" content="XO · AI Robotics Club">
  <meta property="og:description" content="Level: Hardest. If you win, your prize is waiting for you!">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/Blanka-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="engine.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">
        <img class="logo" src="assets/logo.png" alt="AI Robotics Club" width="600" height="504">
        <h1 class="title" aria-label="XO"><span class="title-x">X</span><span class="title-o">O</span></h1>
      </div>

      <div class="level">
        <span class="level-dot" aria-hidden="true"></span>
        <span>Level: <strong>Hardest</strong></span>
      </div>

      <p class="prize">
        <svg class="prize-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="8" width="18" height="4" rx="1"/>
          <path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/>
          <path d="M12 8v13"/>
          <path d="M12 8C10.6 4.6 7 4.2 7 6.2 7 7.6 9 8 12 8Z"/>
          <path d="M12 8c1.4-3.4 5-3.8 5-1.8 0 1.4-2 1.8-5 1.8Z"/>
        </svg>
If you win<span class="punct">,</span> your prize is waiting for you!
      </p>

      <section class="scoreboard" aria-label="Score">
        <div class="score score--you">
          <span class="score-label">You</span>
          <span class="score-value" id="score-you">0</span>
        </div>
        <div class="score score--draw">
          <span class="score-label">Draw</span>
          <span class="score-value" id="score-draw">0</span>
        </div>
        <div class="score score--ai">
          <span class="score-label">AI</span>
          <span class="score-value" id="score-ai">0</span>
        </div>
      </section>
    </header>

    <section class="play" aria-label="Game">
      <div class="board" id="board" role="grid" aria-label="XO board"></div>

      <div class="status-wrap" aria-live="polite">
        <p class="status" id="status">Your turn</p>
        <p class="substatus" id="substatus">You play <span class="tag-x">X</span>. Tap a square to begin.</p>
      </div>

      <div class="controls">
        <div class="starter" role="radiogroup" aria-label="Who moves first">
          <span class="starter-label">First move</span>
          <button type="button" class="starter-opt" role="radio" aria-checked="true" data-starter="human">You</button>
          <button type="button" class="starter-opt" role="radio" aria-checked="false" data-starter="ai">AI</button>
        </div>
        <button type="button" class="btn" id="new-game">New game</button>
      </div>

      <button type="button" class="reset-score" id="reset-score">Reset score</button>
    </section>
  </main>
</body>
</html>
